name: Android APK

# Builds the APK on a GitHub-hosted runner, so no Android SDK, JDK or Gradle
# is needed on your own machine. Download the result from the run's Artifacts.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Analyze, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: dart analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: werenga-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: werenga-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
