<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .stage { position: relative; width: 1024px; height: 1024px; }
  .bg { position: absolute; inset: 0; background:
        radial-gradient(circle at 42% 32%, #1B6E51 0%, #0E4634 48%, #071F18 100%); }
  .pattern { position: absolute; inset: 0; opacity: 0.10; }
  .emblem { position: absolute; left: 31px; top: 31px; width: 962px; height: 962px; filter: drop-shadow(0 18px 40px rgba(0,0,0,0.35)); }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <svg class="pattern" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="starGrid" x="0" y="0" width="170" height="170" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#D9BC7D" stroke-width="1.6">
            <rect x="35" y="35" width="100" height="100"/>
            <rect x="35" y="35" width="100" height="100" transform="rotate(45 85 85)"/>
            <circle cx="85" cy="85" r="26"/>
          </g>
        </pattern>
      </defs>
      <rect width="1024" height="1024" fill="url(#starGrid)"/>
    </svg>
    <div class="bg" style="background: radial-gradient(circle at 50% 48%, rgba(27,110,81,0.0) 0%, rgba(7,31,24,0.55) 100%);"></div>
    <img class="emblem" src="../assets/brand/werenga_emblem.svg" alt="" />
  </div>
</body>
</html>
